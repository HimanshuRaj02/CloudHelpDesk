<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudHelpDesk | Support Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .badge {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #172554;
        }

        .hero p {
            color: #64748b;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 25px;
            color: #172554;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .file-box {
            padding: 10px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            display: block !important;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            display: block !important;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">☁ CloudHelpDesk</div>
    <div class="badge">IT Support Portal</div>
</header>

<main class="container">

    <section class="hero">
        <h1>How can we help?</h1>
        <p>Submit your IT support request and our team will review it.</p>
    </section>

    <section class="card">

        <h2>Submit a Support Ticket</h2>

        <form id="ticketForm">

            <div class="form-group">
                <label for="title">Issue / Problem</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Example: Laptop keyboard is not working"
                    required
                >
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="file">Attachment (Optional)</label>

                <input
                    class="file-box"
                    type="file"
                    id="file"
                >
            </div>

            <button type="submit" id="submitButton">
                Submit Support Ticket
            </button>

        </form>

        <p id="message"></p>

    </section>

    <div class="footer">
        CloudHelpDesk • Cloud-based IT Support System
    </div>

</main>

<script>

    const form = document.getElementById("ticketForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";

        message.className = "";
        message.style.display = "none";

        try {

            const title = document.getElementById("title").value;
            const priority = document.getElementById("priority").value;
            const file = document.getElementById("file").files[0];

            let attachment = null;

            // Upload attachment to S3
            if (file) {

                const formData = new FormData();

                formData.append("file", file);

                const uploadResponse = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error("File upload failed");
                }

                const uploadData = await uploadResponse.json();

                attachment = uploadData.filename;
            }

            // Create ticket in RDS
            const ticketResponse = await fetch("/tickets", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    priority: priority,
                    attachment: attachment
                })
            });

            if (!ticketResponse.ok) {
                throw new Error("Ticket creation failed");
            }

            const ticketData = await ticketResponse.json();

            message.textContent =
                "✓ " + ticketData.message;

            message.className = "success";

            form.reset();

        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong. Please try again.";

            message.className = "error";

        } finally {

            submitButton.disabled = false;
            submitButton.textContent = "Submit Support Ticket";

        }

    });

</script>

</body>
</html>
